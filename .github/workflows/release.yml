name: Release

on:
  workflow_call:
    inputs:
      npm:
        description: "npm release mode: 'publish' (update package.json + publish), 'version' (update package.json only), 'none' (no package.json)"
        type: string
        default: 'publish'
    outputs:
      released:
        description: Whether a release was actually made
        value: ${{ jobs.release.outputs.released }}
      version:
        description: The version that was released
        value: ${{ jobs.release.outputs.version }}
    secrets:
      RELEASE_BOT_GITHUB_TOKEN:
        required: true


jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.set-outputs.outputs.released }}
      version: ${{ steps.release-changelog.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_BOT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: ${{ inputs.npm != 'none' }}
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git author
        run: |
          git config --global user.name "Open Terms Archive Release Bot"
          git config --global user.email "release-bot@opentermsarchive.org"

      - name: Update changelog for release
        id: release-changelog
        uses: OpenTermsArchive/changelog-action/release@v0.2.0

      - name: Bump package version
        if: ${{ inputs.npm != 'none' }}
        run: npm --no-git-tag-version version ${{ steps.release-changelog.outputs.version }}

      - name: Commit changes and create tag
        run: |
          git add "CHANGELOG.md"
          if [[ "${{ inputs.npm }}" != "none" ]]; then
            git add "package.json"
            git add "package-lock.json"
          fi
          git commit -m "Release v${{ steps.release-changelog.outputs.version }}"
          git tag v${{ steps.release-changelog.outputs.version }}

      - name: Publish to npm
        if: ${{ inputs.npm == 'publish' }}
        run: npm publish --provenance

      - name: Push changes to repository
        run: git push origin main && git push --tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release-changelog.outputs.version }}
          body: ${{ steps.release-changelog.outputs.content }}
          token: ${{ secrets.RELEASE_BOT_GITHUB_TOKEN }}

      - name: Set outputs
        id: set-outputs
        run: echo "released=true" >> "$GITHUB_OUTPUT"
